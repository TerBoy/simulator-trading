function AssetLogo({ sym, size = 22 }) {
  const [srcIdx, setSrcIdx] = useState(0);
  useEffect(() => { setSrcIdx(0); }, [sym]);

  if (BRAND_SVGS[sym]) {
    return h`<div style=${{ width: size, height: size }} class="shrink-0 flex items-center justify-center overflow-hidden rounded-full">${BRAND_SVGS[sym]()}</div>`;
  }

  const domain = ASSET_DOMAINS[sym];
  const sources = domain ? [
    `https://icons.duckduckgo.com/ip3/${domain}.ico`,
    `https://www.google.com/s2/favicons?domain=${domain}&sz=64`
  ] : [];

  if (!sources.length || srcIdx >= sources.length) {
    return h`<div style=${{ width: size, height: size }} class="rounded-full bg-zinc-900 border border-zinc-700 flex items-center justify-center shrink-0 font-bold text-[9px] text-zinc-300">${sym.slice(0, 3)}</div>`;
  }

  return h`<img src=${sources[srcIdx]} alt=${sym} loading="lazy" onError=${() => setSrcIdx(i => i + 1)} style=${{ width: size, height: size }} class="rounded-full bg-white p-[1.5px] object-contain border border-zinc-700 shrink-0"/>`;
}

function MediaLogo({ outlet, size = 16 }) {
  const [err, setErr] = useState(false);
  const info = outlet || MEDIA_OUTLETS[0];
  useEffect(() => { setErr(false); }, [info.domain]);
  if (err) {
    return h`<span class="px-1 py-0.2 rounded bg-zinc-800 text-white font-black text-[9px]">${info.badge}</span>`;
  }
  return h`<img src=${`https://icons.duckduckgo.com/ip3/${info.domain}.ico`} alt=${info.name} loading="lazy" onError=${() => setErr(true)} style=${{ width: size, height: size }} class="rounded-sm bg-white p-[1px] object-contain shrink-0"/>`;
}

const fmtCap = (millions) => {
  const usdVal = millions * 1e6;
  if (usdVal >= 1e12) return '$' + (usdVal / 1e12).toFixed(2) + ' T';
  if (usdVal >= 1e9) return '$' + (usdVal / 1e9).toFixed(1) + ' B';
  return '$' + (usdVal / 1e6).toFixed(0) + ' M';
};

const fmtBillion = (val) => {
  const abs = Math.abs(val);
  const sign = val < 0 ? '-' : '';
  if (abs >= 1e12) return sign + '$' + (abs / 1e12).toFixed(2) + ' T';
  if (abs >= 1e9) return sign + '$' + (abs / 1e9).toFixed(1) + ' B';
  if (abs >= 1e6) return sign + '$' + (abs / 1e6).toFixed(1) + ' M';
  if (abs >= 1e3) return sign + '$' + (abs / 1e3).toFixed(1) + ' K';
  return usd(val);
};

const scaleAssetLiq = (baseLiq, capUsd) => Math.max(baseLiq, baseLiq * (capUsd / 1e6));

const nz = () => { let u = 0; while (!u) u = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(6.2832 * Math.random()); };
const nb = a => a.bk = Array.from({ length: 12 }, () => Math.random() * 0.8 + 0.2);
const lv = (a, s, i) => ({ px: a.p * Math.exp(s * a.sp * (i + 0.5)), sz: Math.max(0.01, Math.round(a.liq / 30 * (0.5 + a.bk[i % 12]) * 100) / 100) });

function walk(a, side, q, twap = false) {
  const effQ = twap ? q * 0.2 : q;
  const s = side === 'buy' ? 1 : -1;
  let r = effQ, c = 0, l = a.p, i = 0;
  while (r > 0 && i < 5000) {
    const L = lv(a, s, i++), t = Math.min(r, L.sz);
    c += t * L.px; r -= t; l = L.px;
  }
  c += r * l;
  return { v: effQ > 0 ? c / effQ : a.p, l };
}

function mv(a, r, k) {
  const o = a.p, w = a.sig * k * 0.25;
  r = Math.max(-0.22, Math.min(0.22, r || 0));
  a.p = Math.max(0.01, o * Math.exp(r));
  a.c.push({
    o, c: a.p,
    h: Math.max(o, a.p) * (1 + Math.abs(nz()) * w),
    l: Math.min(o, a.p) * (1 - Math.abs(nz()) * w),
    v: Math.max(1, Math.round(a.liq * (0.1 + Math.random() * 0.15) * (1 + Math.min(3, Math.abs(r) / a.sig))))
  });
  if (a.c.length > 400) { a.c.shift(); a.base++; }
  a.bias *= 0.93;
  a.vm = 1 + (a.vm - 1) * 0.92;
  if (a.mN > 0 && --a.mN === 0) { a.mom = a.cr; a.mN = a.cr ? 5 : 0; a.cr = 0; }
  nb(a);
}

function evolve(g, k, bs, f) {
  const M = nz(), S = {}, R = {};
  const L = g.A.filter(a => a.sym !== 'SPY' && a.sec !== 'ETF' && f(a.sym));
  L.forEach(a => R[a.sym] = a.mu * k + a.bias * bs + a.mom + a.sig * a.vm * k * (a.bm * M + 0.4 * (S[a.gp] ??= nz()) + 0.75 * nz()) - 0.5 * (a.sig * k) ** 2);
  if (R.XOM > 0.003) { R.WMT -= 0.2 * R.XOM; R.BA -= 0.3 * R.XOM; R.MCD -= 0.15 * R.XOM; }
  const R0 = { ...R };
  L.forEach(a => { if (a.rv in R0) R[a.sym] -= 0.3 * R0[a.rv]; });

  const techAvg = ((R.NVDA || 0) + (R.MSFT || 0) + (R.AAPL || 0) + (R.GOOGL || 0) + (R.META || 0)) / 5;
  const chipAvg = ((R.NVDA || 0) + (R.AMD || 0) + (R.TSM || 0) + (R.AVGO || 0)) / 4;
  if (f('TQQQ')) R.TQQQ = techAvg * 3 + nz() * 0.001;
  if (f('SQQQ')) R.SQQQ = -techAvg * 3 + nz() * 0.001;
  if (f('SOXL')) R.SOXL = chipAvg * 3.2 + nz() * 0.001;
  if (f('SOXS')) R.SOXS = -chipAvg * 3.2 + nz() * 0.001;

  if (f('SPY') && L.length > 0) {
    const st = L.filter(a => !CR.includes(a.sym));
    if (st.length > 0) R.SPY = st.reduce((s, a) => s + R[a.sym], 0) / st.length;
  }
  g.A.forEach(a => { if (a.sym in R) mv(a, R[a.sym], k); });
}

function initBillionaires(g) {
  return BILLIONAIRES_100.map(([name, country, baseB, weights], idx) => {
    const totalUsd = baseB * 1e9;
    let allocated = 0;
    const holdings = weights.map(([sym, pct]) => {
      const asset = g.a[sym];
      const val = totalUsd * pct;
      allocated += val;
      const shares = asset ? val / asset.p : 0;
      return { sym, shares };
    });
    const cash = Math.max(0, totalUsd - allocated);
    return { id: 'b_' + idx, name, country, baseVal: totalUsd, cash, holdings };
  });
}

function calcBillionaireVal(b, g) {
  let sum = b.cash;
  for (let i = 0; i < b.holdings.length; i++) {
    const hItem = b.holdings[i];
    const asset = g.a[hItem.sym];
    if (asset) sum += hItem.shares * asset.p;
  }
  return sum;
}

function scheduleEarnings(g) {
  const pool = g.A.filter(a => !CR.includes(a.sym) && a.sym !== 'SPY' && a.sec !== 'ETF');
  const picked = [];
  while (picked.length < 4 && pool.length > 0) {
    const idx = Math.floor(Math.random() * pool.length);
    const item = pool.splice(idx, 1)[0];
    picked.push({ sym: item.sym, name: item.name, inDays: picked.length + 1 });
  }
  g.earningsCal = picked;
}

function mkGame(cap = 1e8, savedData = null) {
  const safeCap = Math.max(100, Number(cap) || 1e8);
  const g = {
    d: 0, tk: 0, cash: safeCap, k0: safeCap, bonds: 0, debt: 0, aum: 0,
    P: {}, L: [], N: [], O: [], B: [], OP: [], alerts: [], levels: {},
    a: {}, id: 0, oid: 1, bid: 1, opid: 1, alid: 1,
    eqHist: [1.0], spyHist: [1.0], spyBase: 754.37,
    billionaires: [],
    earningsCal: [],
    rumor: null,
    upgrades: {},
    unlocked: {},
    favs: ['NVDA', 'AAPL', 'TSLA', 'BTC', 'SPY', 'TQQQ'],
    openTabs: ['NVDA', 'BTC', 'TSLA', 'TQQQ'],
    stats: { trades: 0, shortWins: 0, limitsFilled: 0, blitzWins: 0, optionWins: 0 }
  };

  if (savedData && Array.isArray(savedData.A) && savedData.A.length > 0) {
    Object.assign(g, savedData);
    g.a = {};
    g.A.forEach(a => { g.a[a.sym] = a; });
    if (!g.B) g.B = [];
    if (!g.OP) g.OP = [];
    if (!g.alerts) g.alerts = [];
    if (!g.levels) g.levels = {};
    if (!g.upgrades) g.upgrades = {};
    if (!g.billionaires || !g.billionaires.length) g.billionaires = initBillionaires(g);
    if (!g.earningsCal || !g.earningsCal.length) scheduleEarnings(g);
    return g;
  }

  g.A = AS.map(([sym, name, sec, p, sig, liq, sp, bm, sh]) => {
    const a = {
      sym, name, sec, p, sig, liq: scaleAssetLiq(liq, safeCap), sp, bm, sh,
      mu: CR.includes(sym) || sec === 'ETF' ? 0 : 2e-5, rv: RV[sym],
      gp: sec === 'ENE' ? ({ XOM: 'OIL', CVX: 'OIL', GOLD: 'GOLD', SPY: 'SPY' }[sym] || 'CRY') : sec,
      c: [], mk: [], base: 0, bias: 0, vm: 1, mom: 0, mN: 0, cr: 0, d0: p
    };
    nb(a); g.a[sym] = a; return a;
  });
  for (let i = 0; i < 70; i++) evolve(g, 1, 1, () => true);
  g.A.forEach(a => a.d0 = a.p);
  g.spyBase = g.a.SPY.p;
  g.billionaires = initBillionaires(g);
  scheduleEarnings(g);
  fire(g, false);
  return g;
}

const getFeeRate = g => (g.upgrades?.t2 ? 0.00005 : 0.0001);
const getMaxLev = g => (g.upgrades?.t2 ? 20 : 10);

function exec(g, s, side, q, lev = 1, kind = null) {
  const a = g.a[s];
  if (!a) return 'Activo no encontrado';
  q = Math.floor(q * 1e4) / 1e4;
  if (!(q > 0)) return 'Cantidad inválida / Invalid quantity';
  lev = Math.max(1, Math.min(getMaxLev(g), lev || 1));

  const P = g.P[s] || (g.P[s] = { q: 0, avg: 0, margin: 0, lev: 1, div: 0, rl: 0, sl: 0, tp: 0 });
  const prevQ = P.q;
  const w = walk(a, side, q, !!g.upgrades?.twap);
  const notional = w.v * q;
  const fee = notional * getFeeRate(g);
  let pnl = 0;
  let rem = 0;

  if (side === 'buy') {
    if (P.q < 0) {
      const closeQ = Math.min(q, Math.abs(P.q));
      const closeNotional = w.v * closeQ;
      const closeFee = closeNotional * getFeeRate(g);
      const ratio = closeQ / Math.abs(P.q);
      const releasedMargin = P.margin * ratio;
      pnl = (P.avg - w.v) * closeQ - closeFee;
      if (pnl > 0) g.stats.shortWins++;
      g.cash += releasedMargin + pnl;
      P.margin = Math.max(0, P.margin - releasedMargin);
      P.rl += pnl;
      P.q = Math.round((P.q + closeQ) * 1e4) / 1e4;
      if (Math.abs(P.q) < 1e-4) { P.q = 0; P.avg = 0; P.margin = 0; P.lev = 1; P.sl = P.tp = 0; }
      rem = Math.round((q - closeQ) * 1e4) / 1e4;
    } else {
      const reqMargin = notional / lev;
      if (reqMargin + fee > g.cash) return `Insufficient margin (${usd(reqMargin + fee)})`;
      g.cash -= (reqMargin + fee);
      const newQ = Math.round((P.q + q) * 1e4) / 1e4;
      P.avg = (P.avg * P.q + notional) / newQ;
      P.q = newQ;
      P.margin += reqMargin;
      P.lev = Math.round((P.q * P.avg) / Math.max(1e-6, P.margin) * 10) / 10;
    }
  } else {
    if (P.q > 0) {
      const closeQ = Math.min(q, P.q);
      const closeNotional = w.v * closeQ;
      const closeFee = closeNotional * getFeeRate(g);
      const ratio = closeQ / P.q;
      const releasedMargin = P.margin * ratio;
      pnl = (w.v - P.avg) * closeQ - closeFee;
      g.cash += releasedMargin + pnl;
      P.margin = Math.max(0, P.margin - releasedMargin);
      P.rl += pnl;
      P.q = Math.round((P.q - closeQ) * 1e4) / 1e4;
      if (P.q < 1e-4) { P.q = 0; P.avg = 0; P.margin = 0; P.lev = 1; P.sl = P.tp = 0; }
      rem = Math.round((q - closeQ) * 1e4) / 1e4;
    } else {
      const reqMargin = notional / lev;
      if (reqMargin + fee > g.cash) return `Insufficient margin for Short (${usd(reqMargin + fee)})`;
      g.cash -= (reqMargin + fee);
      const absOld = Math.abs(P.q);
      const newAbs = Math.round((absOld + q) * 1e4) / 1e4;
      P.avg = (P.avg * absOld + notional) / newAbs;
      P.q = -newAbs;
      P.margin += reqMargin;
      P.lev = Math.round((newAbs * P.avg) / Math.max(1e-6, P.margin) * 10) / 10;
    }
  }

  const execQ = rem > 0 ? Math.round((q - rem) * 1e4) / 1e4 : q;
  const execFee = w.v * execQ * getFeeRate(g);
  const I = Math.log(w.l / a.p), c = a.c[a.c.length - 1];
  a.p = w.l;
  if (c) { c.c = a.p; c.h = Math.max(c.h, a.p); c.l = Math.min(c.l, a.p); c.v += execQ; }
  a.mom = I * 0.12; a.mN = 6; a.cr = -I * 0.12 * 6 * 0.6 / 5;
  a.mk.push({ i: a.base + a.c.length - 1, s: side, px: w.v });

  const defaultLabel = side === 'buy'
    ? (prevQ < 0 ? 'Cover Short' : `Buy ${lev > 1 ? lev + 'x' : ''}`)
    : (prevQ > 0 ? 'Sell Long' : `Short ${lev}x`);
  const label = kind || defaultLabel;
  g.L.unshift({ d: g.d, tk: g.tk, sym: s, k: label.trim(), q: execQ, px: w.v, fee: execFee, pnl });
  g.stats.trades++;

  if (rem > 0) {
    return exec(g, s, side, rem, lev, kind);
  }
  return null;
}

function calcOptionPrice(a, type, strike, daysLeft) {
  const intrinsic = type === 'CALL' ? Math.max(0, a.p - strike) : Math.max(0, strike - a.p);
  const timeVal = a.p * a.sig * 4.5 * Math.sqrt(Math.max(0.1, daysLeft));
  return Math.max(0.05, intrinsic + timeVal);
}

function buyOptionContract(g, sym, type, strike, days, contracts) {
  const a = g.a[sym];
  if (!(contracts >= 1)) return 'Min 1 contract (100 shares)';
  const premiumPerShare = calcOptionPrice(a, type, strike, days);
  const totalCost = premiumPerShare * 100 * contracts;
  if (totalCost > g.cash) return `Insufficient premium (${usd(totalCost)})`;
  g.cash -= totalCost;
  g.OP.unshift({ id: g.opid++, sym, type, strike, daysLeft: days, contracts, cost: totalCost, entryPx: a.p });
  g.L.unshift({ d: g.d, tk: g.tk, sym, k: `Buy ${type} $${strike.toFixed(0)} (${days}d)`, q: contracts, px: premiumPerShare, fee: 0, pnl: 0 });
  g.stats.trades++;
  return null;
}

function closeOptionContract(g, id, expired = false) {
  const idx = g.OP.findIndex(o => o.id === id);
  if (idx === -1) return;
  const o = g.OP[idx];
  const a = g.a[o.sym];
  const curVal = calcOptionPrice(a, o.type, o.strike, expired ? 0 : o.daysLeft) * 100 * o.contracts;
  const pnl = curVal - o.cost;
  g.cash += curVal;
  if (pnl > 0) g.stats.optionWins++;
  g.L.unshift({
    d: g.d, tk: g.tk, sym: o.sym,
    k: `${expired ? 'Exp.' : 'Close'} ${o.type} $${o.strike.toFixed(0)}`,
    q: o.contracts, px: curVal / (100 * o.contracts), fee: 0, pnl
  });
  g.OP.splice(idx, 1);
}

function openBlitzOption(g, sym, dir, stake, durationSec, payoutRate = 0.92) {
  if (!(stake > 0) || stake > g.cash) return 'Insufficient cash for Blitz trade';
  const a = g.a[sym];
  g.cash -= stake;
  g.B.unshift({ id: g.bid++, sym, dir, stake, entryPx: a.p, remSec: durationSec, totalSec: durationSec, payoutRate });
  g.stats.trades++;
  return null;
}

function tickBlitzSecond(g) {
  if (!g.B || !g.B.length) return;
  for (let i = g.B.length - 1; i >= 0; i--) {
    const b = g.B[i];
    b.remSec -= 1;
    if (b.remSec <= 0) {
      const curPx = g.a[b.sym].p;
      const won = (b.dir === 'up' && curPx > b.entryPx) || (b.dir === 'down' && curPx < b.entryPx);
      const tie = curPx === b.entryPx;
      let pnl = -b.stake;
      if (won) {
        g.cash += b.stake * (1 + b.payoutRate);
        pnl = b.stake * b.payoutRate;
        g.stats.blitzWins++;
      } else if (tie) {
        g.cash += b.stake;
        pnl = 0;
      }
      g.L.unshift({
        d: g.d, tk: g.tk, sym: b.sym,
        k: `Blitz ${b.dir === 'up' ? 'UP ↗' : 'DOWN ↘'} (${won ? 'WON' : tie ? 'TIE' : 'LOST'})`,
        q: b.stake, px: curPx, fee: 0, pnl
      });
      g.B.splice(i, 1);
    }
  }
}

function addLimitOrder(g, sym, side, q, targetPx, lev) {
  q = Math.floor(q * 1e4) / 1e4;
  if (!(q > 0) || !(targetPx > 0)) return 'Invalid quantity or target price';
  g.O.unshift({ id: g.oid++, sym, side, q, targetPx, lev, created: tm(g.d, g.tk) });
  return null;
}

function check(g) {
  for (let i = g.O.length - 1; i >= 0; i--) {
    const o = g.O[i];
    const a = g.a[o.sym];
    if (!a) continue;
    const hit = (o.side === 'buy' && a.p <= o.targetPx) || (o.side === 'sell' && a.p >= o.targetPx);
    if (hit) {
      const err = exec(g, o.sym, o.side, o.q, o.lev, `Limit ${o.side === 'buy' ? 'Buy' : 'Sell'}`);
      if (!err) { g.stats.limitsFilled++; g.O.splice(i, 1); }
    }
  }

  for (let i = g.alerts.length - 1; i >= 0; i--) {
    const al = g.alerts[i];
    const a = g.a[al.sym];
    if (!a) continue;
    const triggered = (al.cond === 'above' && a.p >= al.val) || (al.cond === 'below' && a.p <= al.val);
    if (triggered) {
      g.L.unshift({ d: g.d, tk: g.tk, sym: al.sym, k: `Price Alert (${al.cond === 'above' ? '≥' : '≤'} ${usd(al.val)})`, q: 1, px: a.p, fee: 0, pnl: 0 });
      g.alerts.splice(i, 1);
    }
  }

  Object.entries(g.P).forEach(([s, p]) => {
    const a = g.a[s];
    if (!a) return;
    if (p.q > 0) {
      const uPnl = (a.p - p.avg) * p.q;
      if (p.margin > 0 && uPnl <= -p.margin * 0.85) {
        exec(g, s, 'sell', p.q, 1, 'LIQUIDATION (Margin Call)');
        return;
      }
      const sl = p.sl && a.p <= p.sl;
      if (sl || (p.tp && a.p >= p.tp)) exec(g, s, 'sell', p.q, 1, sl ? 'Stop Loss' : 'Take Profit');
    } else if (p.q < 0) {
      const absQ = Math.abs(p.q);
      const uPnl = (p.avg - a.p) * absQ;
      if (p.margin > 0 && uPnl <= -p.margin * 0.85) {
        exec(g, s, 'buy', absQ, 1, 'SHORT LIQUIDATION');
        return;
      }
      const sl = p.sl && a.p >= p.sl;
      if (sl || (p.tp && a.p <= p.tp)) exec(g, s, 'buy', absQ, 1, sl ? 'Stop Loss Short' : 'Take Profit Short');
    }
  });

  MISSIONS_DEF.forEach(m => {
    if (!g.unlocked[m.id] && m.check(g)) {
      g.unlocked[m.id] = true;
      const scaleReward = m.reward * (g.k0 / 1e8);
      g.cash += scaleReward;
      g.L.unshift({ d: g.d, tk: g.tk, sym: 'Bonus', k: `Milestone: ${m.title_en}`, q: 1, px: scaleReward, fee: 0, pnl: scaleReward });
    }
  });
}

function night(g) {
  g.A.forEach(a => a.d0 = a.p);

  for (let i = g.OP.length - 1; i >= 0; i--) {
    g.OP[i].daysLeft -= 1;
    if (g.OP[i].daysLeft <= 0) closeOptionContract(g, g.OP[i].id, true);
  }

  if (g.earningsCal && g.earningsCal.length) {
    g.earningsCal.forEach(e => e.inDays -= 1);
    g.earningsCal = g.earningsCal.filter(e => e.inDays > 0);
    if (g.earningsCal.length === 0) scheduleEarnings(g);
  }

  evolve(g, 2.5, 7, s => !CR.includes(s));
  for (let i = 0; i < 4; i++) evolve(g, 1.8, 3, s => CR.includes(s));
  g.d++; g.tk = 0;

  if (g.bonds > 0) g.bonds += g.bonds * 0.0003;
  if (g.debt > 0) g.debt += g.debt * 0.0005;

  const myRet = eq(g) / g.k0 - 1;
  const spyRet = g.a.SPY.p / g.spyBase - 1;
  if (myRet > spyRet + 0.01 && myRet > 0) {
    const inflow = g.k0 * 0.15;
    g.aum += inflow;
    const mgmtFee = g.aum * 0.0002;
    g.cash += mgmtFee;
    if (mgmtFee > 10) g.L.unshift({ d: g.d, tk: 0, sym: 'AUM', k: 'Mgmt Fee (2%)', q: 1, px: mgmtFee, fee: 0, pnl: mgmtFee });
  } else if (myRet < spyRet - 0.04 && g.aum > 0) {
    g.aum *= 0.7;
  }

  if (g.d % 30 === 0) DV.forEach(s => {
    const P = g.P[s], a = g.a[s];
    if (P && P.q > 0) {
      const m = P.q * a.p * 0.005;
      g.cash += m; P.div += m;
      g.L.unshift({ d: g.d, tk: 0, sym: s, k: 'Dividend', q: P.q, px: a.p * 0.005, fee: 0, pnl: m });
    }
  });
  check(g);
  saveGame(g);
}

function tick(g) {
  evolve(g, 1, 1, () => true);
  g.tk++;
  check(g);
  const curEq = eq(g);
  g.eqHist.push(curEq / g.k0);
  g.spyHist.push(g.a.SPY.p / g.spyBase);
  if (g.eqHist.length > 100) { g.eqHist.shift(); g.spyHist.shift(); }
  if (g.tk >= 39) night(g);
}

const uf = (a, side, usdVal, lev = 1, g = null) => {
  const feeRate = g ? getFeeRate(g) : 1e-4;
  const s = side === 'buy' ? 1 : -1;
  // Descontar el fee estimado del presupuesto de margen disponible para evitar "Insufficient margin" al 100%
  const netMarginBudget = usdVal / (1 + feeRate * lev);
  let b = netMarginBudget * lev, q = 0, i = 0;
  while (b > 0 && i < 5000) {
    const L = lv(a, s, i++), c = L.px * L.sz;
    if (b >= c) { q += L.sz; b -= c; } else { q += b / L.px; b = 0; }
  }
  return Math.floor(q * 1e4) / 1e4;
};

const eq = g => {
  const posVal = Object.entries(g.P).reduce((s, [k, p]) => {
    if (!p.q || !g.a[k]) return s;
    const px = g.a[k].p;
    const uPnl = p.q > 0 ? (px - p.avg) * p.q : (p.avg - px) * Math.abs(p.q);
    return s + p.margin + uPnl;
  }, 0);
  const optVal = (g.OP || []).reduce((s, o) => s + calcOptionPrice(g.a[o.sym], o.type, o.strike, o.daysLeft) * 100 * o.contracts, 0);
  const blitzStake = (g.B || []).reduce((s, b) => s + b.stake, 0);
  return g.cash + (g.bonds || 0) - (g.debt || 0) + posVal + optVal + blitzStake;
};

function parseCapitalInput(raw) {
  if (typeof raw === 'number') return Number.isFinite(raw) ? raw : 0;
  if (!raw) return 0;
  const cleaned = String(raw).trim().toLowerCase().replace(/[$,\s]/g, '');
  const match = cleaned.match(/^(-?\d+(?:\.\d+)?)([kmbt])?$/);
  if (!match) {
    const n = Number(cleaned);
    return Number.isFinite(n) ? n : 0;
  }
  const num = parseFloat(match[1]);
  const mult = { '': 1, k: 1e3, m: 1e6, b: 1e9, t: 1e12 }[match[2] || ''] || 1;
  return num * mult;
}

function Chart({ a, P, blitzList, customLevels, onAddLevel, drawMode, mode, sma, ema, bb, rsiOn, macdOn, vol, t }) {
  const [hoverIdx, setHoverIdx] = useState(null);
  const [hoverPrice, setHoverPrice] = useState(null);
  const W = 820, H = 370, N = 75, pw = W - 76, bw = pw / N;
  const hMacd = macdOn ? 52 : 0;
  const hRsi = rsiOn ? 50 : 0;
  const hv = vol ? 36 : 0;
  const ph = H - hv - hRsi - hMacd - 10;

  const st = Math.max(0, a.c.length - N), cs = a.c.slice(st);
  const closes = a.c.map(x => x.c);

  const calcEmaArr = (arr, period) => {
    const k = 2 / (period + 1);
    let prev = arr[0] ?? a.p;
    return arr.map((v, i) => { prev = i === 0 ? v : v * k + prev * (1 - k); return prev; });
  };

  const sm = closes.map((_, i) => i < 19 ? null : closes.slice(i - 19, i + 1).reduce((s, v) => s + v, 0) / 20).slice(st);
  const ema12All = calcEmaArr(closes, 12);
  const ema26All = calcEmaArr(closes, 26);
  const macdLineAll = ema12All.map((v, i) => v - ema26All[i]);
  const signalLineAll = calcEmaArr(macdLineAll, 9);

  const em = ema12All.slice(st);
  const macdSlice = macdLineAll.slice(st);
  const sigSlice = signalLineAll.slice(st);
  const histSlice = macdSlice.map((v, i) => v - sigSlice[i]);

  const bBands = closes.map((_, i) => {
    if (i < 19) return null;
    const slice = closes.slice(i - 19, i + 1);
    const mean = slice.reduce((s, v) => s + v, 0) / 20;
    const std = Math.sqrt(slice.reduce((s, v) => s + (v - mean) ** 2, 0) / 20);
    return { u: mean + 2 * std, l: mean - 2 * std };
  }).slice(st);

  const rsiArr = closes.map((_, i) => {
    if (i < 14) return 50;
    let gains = 0, losses = 0;
    for (let j = i - 13; j <= i; j++) {
      const diff = closes[j] - closes[j - 1];
      if (diff >= 0) gains += diff; else losses -= diff;
    }
    if (losses === 0) return 100;
    return 100 - (100 / (1 + (gains / 14) / (losses / 14)));
  }).slice(st);

  const curRsi = rsiArr[rsiArr.length - 1] ?? 50;
  const bullPct = Math.max(15, Math.min(85, Math.round(curRsi * 0.6 + 20 + a.bias * 1200)));
  const bearPct = 100 - bullPct;

  let hi = Math.max(...cs.map(c => c.h), a.p), lo = Math.min(...cs.map(c => c.l), a.p);
  if (bb) bBands.forEach(b => { if (b) { hi = Math.max(hi, b.u); lo = Math.min(lo, b.l); } });
  if (P.q !== 0) { hi = Math.max(hi, P.avg); lo = Math.min(lo, P.avg); }
  blitzList.forEach(b => { hi = Math.max(hi, b.entryPx); lo = Math.min(lo, b.entryPx); });

  const pd = (hi - lo) * 0.09 || Math.max(0.5, a.p * 0.01); hi += pd; lo -= pd;
  const span = Math.max(1e-6, hi - lo);
  const y = v => 8 + (hi - v) / span * (ph - 16);
  const invY = py => hi - ((py - 8) / Math.max(1, ph - 16)) * span;
  const x = i => 18 + i * bw + bw / 2;
  const vm = Math.max(...cs.map(c => c.v), 1);

  const ln = (v, col, dash, lbl, bright = false, uid = '') => v > 0 && v >= lo && v <= hi && h`<g key=${uid + '_' + lbl + '_' + v.toFixed(4)}>
    <line x1="14" x2=${pw} y1=${y(v)} y2=${y(v)} stroke=${col} strokeWidth=${bright ? '1.5' : '1'} strokeDasharray=${dash}/>
    <rect x=${pw + 2} y=${y(v) - 8} width="70" height="16" rx="2" fill=${bright ? '#fafafa' : col}/>
    <text x=${W - 4} y=${y(v) + 3.5} textAnchor="end" fill="#09090b" fontSize="9.5" fontWeight="900">${lbl} ${v.toFixed(2)}</text>
  </g>`;

  const pts = cs.map((c, i) => x(i) + ',' + y(c.c)).join(' ');
  const hovCandle = (hoverIdx !== null && cs[hoverIdx]) ? cs[hoverIdx] : (cs[cs.length - 1] || { o: a.p, h: a.p, l: a.p, c: a.p });

  const onMouseMove = e => {
    const rect = e.currentTarget.getBoundingClientRect();
    const relX = ((e.clientX - rect.left) / rect.width) * W;
    const relY = ((e.clientY - rect.top) / rect.height) * H;
    const idx = Math.floor((relX - 18) / bw);
    if (idx >= 0 && idx < cs.length) setHoverIdx(idx);
    else setHoverIdx(null);
    if (relY >= 8 && relY <= ph - 8) setHoverPrice(invY(relY));
    else setHoverPrice(null);
  };

  const onChartClick = () => {
    if (drawMode && hoverPrice) onAddLevel(Number(hoverPrice.toFixed(2)));
  };

  const maxMacd = Math.max(...macdSlice.map(Math.abs), ...sigSlice.map(Math.abs), 1e-4);
  const rsiTop = H - hRsi - hMacd;
  const macdTop = H - hMacd;

  return h`<div class="relative">
    <div class="flex flex-wrap items-center gap-3 px-3 py-1 bg-[#08080a] border-b border-zinc-800/80 text-[10.5px]">
      <span class="text-zinc-500">${t.open}: <b class="text-zinc-200">${hovCandle.o.toFixed(2)}</b></span>
      <span class="text-zinc-500">${t.high}: <b class="text-emerald-400">${hovCandle.h.toFixed(2)}</b></span>
      <span class="text-zinc-500">${t.low}: <b class="text-rose-400">${hovCandle.l.toFixed(2)}</b></span>
      <span class="text-zinc-500">${t.close}: <b class=${cl(hovCandle.c - hovCandle.o)}>${hovCandle.c.toFixed(2)}</b></span>
      <span class="text-zinc-500">RSI(14): <b class=${curRsi > 70 ? 'text-rose-400' : curRsi < 30 ? 'text-emerald-400' : 'text-zinc-200'}>${curRsi.toFixed(1)}</b></span>
      <span class="ml-auto text-[10px] text-zinc-500">${t.sentiment}: <b class="text-emerald-400">${bullPct}% ${t.upWord}</b> / <b class="text-rose-400">${bearPct}% ${t.downWord}</b></span>
    </div>

    <svg viewBox="0 0 ${W} ${H}" onClick=${onChartClick} onMouseMove=${onMouseMove} onMouseLeave=${() => { setHoverIdx(null); setHoverPrice(null); }} class="w-full h-auto block select-none ${drawMode ? 'cursor-cell' : 'cursor-crosshair'} bg-[#08080a]">
      <defs>
        <linearGradient id="ar" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stopColor="#e4e4e7" stopOpacity=".24"/><stop offset="1" stopColor="#e4e4e7" stopOpacity="0"/></linearGradient>
        <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="0.7" fill="#27272a" opacity="0.55"/></pattern>
      </defs>

      <rect x="14" y="0" width=${pw - 14} height=${ph} fill="url(#dots)"/>

      <g>
        <text x="7" y="11" textAnchor="middle" fill="#10b981" fontSize="8" fontWeight="bold">${bullPct}%</text>
        <rect x="4" y="15" width="5" height=${Math.max(0, (ph - 30) * (bullPct / 100))} fill="#10b981" rx="2"/>
        <rect x="4" y=${15 + (ph - 30) * (bullPct / 100)} width="5" height=${Math.max(0, (ph - 30) * (bearPct / 100))} fill="#f43f5e" rx="2"/>
        <text x="7" y=${ph - 4} textAnchor="middle" fill="#f43f5e" fontSize="8" fontWeight="bold">${bearPct}%</text>
      </g>

      ${[0, 1, 2, 3, 4].map(k => {
        const v = lo + span * k / 4;
        return h`<g key=${k}><line x1="14" x2=${pw} y1=${y(v)} y2=${y(v)} stroke="#18181b"/><text x=${W - 4} y=${y(v) + 3} textAnchor="end" fill="#71717a" fontSize="10">${v.toFixed(2)}</text></g>`;
      })}

      ${bb && h`<g>
        <polyline points=${bBands.map((b, i) => b && x(i) + ',' + y(b.u)).filter(Boolean).join(' ')} fill="none" stroke="#a1a1aa" strokeWidth="1" strokeDasharray="3 3"/>
        <polyline points=${bBands.map((b, i) => b && x(i) + ',' + y(b.l)).filter(Boolean).join(' ')} fill="none" stroke="#a1a1aa" strokeWidth="1" strokeDasharray="3 3"/>
      </g>`}

      ${mode === 'c' ? cs.map((c, i) => {
        const col = c.c >= c.o ? '#10b981' : '#f43f5e';
        return h`<g key=${i}><line x1=${x(i)} x2=${x(i)} y1=${y(c.h)} y2=${y(c.l)} stroke=${col} strokeWidth="1.2"/><rect x=${x(i) - bw * 0.36} y=${y(Math.max(c.o, c.c))} width=${bw * 0.72} height=${Math.max(1.5, Math.abs(y(c.o) - y(c.c)))} fill=${col} rx="1"/></g>`;
      }) : h`<g><polygon points=${pts + ' ' + x(cs.length - 1) + ',' + ph + ' ' + x(0) + ',' + ph} fill="url(#ar)"/><polyline points=${pts} fill="none" stroke="#f4f4f5" strokeWidth="2"/></g>`}

      ${sma && h`<polyline points=${sm.map((v, i) => v && x(i) + ',' + y(v)).filter(Boolean).join(' ')} fill="none" stroke="#d4d4d8" strokeWidth="1.4"/>`}
      ${ema && h`<polyline points=${em.map((v, i) => v && x(i) + ',' + y(v)).filter(Boolean).join(' ')} fill="none" stroke="#38bdf8" strokeWidth="1.4"/>`}

      ${customLevels.map((lvPx, idx) => ln(lvPx, lvPx >= a.p ? '#fb7185' : '#34d399', '5 3', lvPx >= a.p ? 'RES' : 'SUP', false, 'lvl_' + idx))}

      ${blitzList.map(b => {
        const Y = y(b.entryPx);
        if (Y < 8 || Y > ph - 8) return null;
        const col = b.dir === 'up' ? '#22c55e' : '#ef4444';
        return h`<g key=${'bz' + b.id}>
          <line x1="14" x2=${pw} y1=${Y} y2=${Y} stroke=${col} strokeWidth="1.5" strokeDasharray="4 2"/>
          <rect x="24" y=${Y - 9} width="125" height="18" rx="3" fill=${col}/>
          <text x="30" y=${Y + 3.5} fill="#09090b" fontSize="9.5" fontWeight="900">${b.dir === 'up' ? '↗' : '↘'} $${b.stake} · ${b.remSec}s</text>
        </g>`;
      })}

      ${ln(a.p, '#ffffff', '2 2', '', true, 'cur')}
      ${ln(P.q !== 0 ? P.avg : 0, '#e4e4e7', '6 4', P.q > 0 ? 'LONG' : 'SHRT', false, 'pos')}
      ${ln(P.q !== 0 ? P.sl : 0, '#f43f5e', '2 2', 'SL', false, 'sl')}
      ${ln(P.q !== 0 ? P.tp : 0, '#10b981', '2 2', 'TP', false, 'tp')}

      ${hoverIdx !== null && cs[hoverIdx] && h`<g>
        <line x1=${x(hoverIdx)} x2=${x(hoverIdx)} y1="0" y2=${H} stroke="#52525b" strokeDasharray="3 3" strokeWidth="0.9"/>
        ${hoverPrice && h`<line x1="14" x2=${pw} y1=${y(hoverPrice)} y2=${y(hoverPrice)} stroke=${drawMode ? '#ffffff' : '#52525b'} strokeDasharray="3 3" strokeWidth="1"/>`}
      </g>`}

      ${vol && cs.map((c, i) => {
        const barH = Math.max(0, (c.v / vm) * (hv - 6));
        return h`<rect key=${'v' + i} x=${x(i) - bw * 0.35} y=${ph + hv - 2 - barH} width=${bw * 0.7} height=${barH} fill=${c.c >= c.o ? '#10b98138' : '#f43f5e38'}/>`;
      })}

      ${rsiOn && h`<g>
        <line x1="14" x2=${pw} y1=${rsiTop} y2=${rsiTop} stroke="#27272a"/>
        <line x1="14" x2=${pw} y1=${rsiTop + hRsi * 0.3} y2=${rsiTop + hRsi * 0.3} stroke="#f43f5e44" strokeDasharray="2 2"/>
        <line x1="14" x2=${pw} y1=${rsiTop + hRsi * 0.7} y2=${rsiTop + hRsi * 0.7} stroke="#10b98144" strokeDasharray="2 2"/>
        <polyline points=${rsiArr.map((r, i) => `${x(i)},${rsiTop + hRsi - 4 - (r / 100) * (hRsi - 8)}`).join(' ')} fill="none" stroke="#d4d4d8" strokeWidth="1.4"/>
        <text x=${W - 6} y=${rsiTop + 12} textAnchor="end" fill="#e4e4e7" fontSize="9" fontWeight="bold">RSI ${curRsi.toFixed(0)}</text>
      </g>`}

      ${macdOn && h`<g>
        <line x1="14" x2=${pw} y1=${macdTop} y2=${macdTop} stroke="#27272a"/>
        <line x1="14" x2=${pw} y1=${macdTop + hMacd / 2} y2=${macdTop + hMacd / 2} stroke="#27272a" strokeDasharray="2 2"/>
        ${histSlice.map((val, i) => {
          const barH = Math.max(0, (Math.abs(val) / maxMacd) * (hMacd / 2 - 4));
          const barY = val >= 0 ? macdTop + hMacd / 2 - barH : macdTop + hMacd / 2;
          return h`<rect key=${'mh' + i} x=${x(i) - bw * 0.3} y=${barY} width=${bw * 0.6} height=${Math.max(1, barH)} fill=${val >= 0 ? '#10b98166' : '#f43f5e66'}/>`;
        })}
        <polyline points=${macdSlice.map((v, i) => `${x(i)},${macdTop + hMacd / 2 - (v / maxMacd) * (hMacd / 2 - 4)}`).join(' ')} fill="none" stroke="#fafafa" strokeWidth="1.2"/>
        <polyline points=${sigSlice.map((v, i) => `${x(i)},${macdTop + hMacd / 2 - (v / maxMacd) * (hMacd / 2 - 4)}`).join(' ')} fill="none" stroke="#71717a" strokeWidth="1.2"/>
        <text x=${W - 6} y=${macdTop + 11} textAnchor="end" fill="#d4d4d8" fontSize="9" fontWeight="bold">MACD</text>
      </g>`}
    </svg>
  </div>`;
}

        </div>`;

function BenchmarkChart({ eqHist, spyHist, t }) {
  const W = 780, H = 190;
  const all = [...eqHist, ...spyHist];
  const min = Math.min(...all) * 0.995, max = Math.max(...all) * 1.005 || 1.01;
  const span = Math.max(1e-6, max - min);
  const x = i => 10 + (i / Math.max(1, eqHist.length - 1)) * (W - 20);
  const y = v => H - 15 - ((v - min) / span) * (H - 30);
  const pEq = eqHist.map((v, i) => `${x(i)},${y(v)}`).join(' ');
  const pSpy = spyHist.map((v, i) => `${x(i)},${y(v)}`).join(' ');
  const myRet = eqHist[eqHist.length - 1] - 1;
  const spyRet = spyHist[spyHist.length - 1] - 1;

  return h`<div class="p-3">
    <div class="flex justify-between items-center mb-2 text-xs">
      <div class="flex items-center gap-4">
        <span class="flex items-center gap-1.5"><span class="w-3 h-1 bg-white inline-block"></span> ${t.yourFundLabel} <b class=${cl(myRet)}>${pc(myRet)}</b></span>
        <span class="flex items-center gap-1.5"><span class="w-3 h-1 bg-zinc-500 inline-block"></span> S&P 500: <b class=${cl(spyRet)}>${pc(spyRet)}</b></span>
      </div>
      <span class="text-[10px] px-2 py-0.5 rounded bg-zinc-900 text-zinc-200 border border-zinc-800">Alpha: <b class=${cl(myRet - spyRet)}>${pc(myRet - spyRet)}</b></span>
    </div>
    <svg viewBox="0 0 ${W} ${H}" class="w-full h-auto bg-[#08080a] rounded border border-zinc-800">
      <line x1="0" x2=${W} y1=${y(1)} y2=${y(1)} stroke="#27272a" strokeDasharray="4 4"/>
      <polyline points=${pSpy} fill="none" stroke="#71717a" strokeWidth="1.8" opacity="0.85"/>
      <polyline points=${pEq} fill="none" stroke="#fafafa" strokeWidth="2.4"/>
    </svg>
  </div>`;
}

function Book({ a, onPickPrice, t }) {
  const K = 7;
  const as = [...Array(K)].map((_, i) => lv(a, 1, i)).reverse();

                  ${g.O.map(o => h`<tr key=${o.id}>
                    <td><b class="text-white">${o.sym}</b></td>
                    <td class=${o.side === 'buy' ? 'text-emerald-400' : 'text-rose-400'}>${o.side === 'buy' ? t.limitBuy : t.limitSell}</td>
                    <td>${o.q}</td>
                    <td>${usd(o.targetPx)}</td>
                    <td>${o.lev}x</td>
                    <td><button onClick=${() => { g.O = g.O.filter(x => x.id !== o.id); saveGame(g); fr(); }} class="px-2 py-0.5 rounded bg-zinc-800 text-rose-400 text-[10px]">${t.cancel}</button></td>
                  </tr>`)}
                </tbody>
              </table>` : h`<div class="p-6 text-center text-zinc-500 text-xs">${t.noLimitOrders}</div>`)}

              ${tab === 'b' && h`<div class="p-4 grid gap-3 sm:grid-cols-2 text-xs">
                <div class="p-3 rounded bg-[#08080a] border border-zinc-800 space-y-2">
                  <div class="flex justify-between"><span class="text-zinc-400">${t.treasuryBonds}</span><b class="text-emerald-400">${fmtBillion(g.bonds)}</b></div>
                  <p class="text-[11px] text-zinc-500">${t.treasuryDesc}</p>
                  <div class="flex gap-2">
                    <button onClick=${() => { const v = +bankAmt; if (v > 0 && g.cash >= v) { g.cash -= v; g.bonds += v; saveGame(g); fr(); } }} class="flex-1 py-1.5 rounded bg-emerald-600/20 border border-emerald-500/40 text-emerald-300 font-bold">${t.buyBonds}</button>
                    <button onClick=${() => { const v = Math.min(+bankAmt, g.bonds); if (v > 0) { g.bonds -= v; g.cash += v; saveGame(g); fr(); } }} class="flex-1 py-1.5 rounded bg-zinc-800 text-zinc-300">${t.withdraw}</button>
                  </div>
                </div>
                <div class="p-3 rounded bg-[#08080a] border border-zinc-800 space-y-2">
                  <div class="flex justify-between"><span class="text-zinc-400">${t.bankDebt}</span><b class="text-rose-400">${fmtBillion(g.debt)}</b></div>
                  <p class="text-[11px] text-zinc-500">${t.bankDebtDesc}</p>
                  <div class="flex gap-2">
                    <button onClick=${() => { const v = +bankAmt; if (v > 0 && g.debt + v <= E * 2) { g.debt += v; g.cash += v; saveGame(g); fr(); } }} class="flex-1 py-1.5 rounded bg-rose-600/20 border border-rose-500/40 text-rose-300 font-bold">${t.takeLoan}</button>
                    <button onClick=${() => { const v = Math.min(+bankAmt, g.debt, g.cash); if (v > 0) { g.debt -= v; g.cash -= v; saveGame(g); fr(); } }} class="flex-1 py-1.5 rounded bg-zinc-800 text-zinc-300">${t.payDebt}</button>
                  </div>
                </div>
                <div class="sm:col-span-2 flex items-center gap-2">
                  <input type="number" step="10000" value=${bankAmt} onInput=${e => setBankAmt(e.target.value)} class="max-w-xs"/>
                  ${[100000, 1000000, 10000000].map(v => h`<button key=${v} onClick=${() => setBankAmt(String(v))} class="px-2 py-1 rounded bg-zinc-900 border border-zinc-800 text-[11px]">${fmtBillion(v)}</button>`)}
                </div>
              </div>`}

              ${tab === 'spy' && h`<${BenchmarkChart} eqHist=${g.eqHist} spyHist=${g.spyHist} t=${t}/>`}

              ${tab === 'h' && h`<table class="w-full text-xs">
                <thead class="text-[10px] text-zinc-500 uppercase border-b border-zinc-800"><tr><th>${t.thDate}</th><th>${t.thAsset}</th><th>${t.thOperation}</th><th>${t.thPrice}</th><th>${t.thResult}</th></tr></thead>
                <tbody class="divide-y divide-zinc-800/60">
                  ${g.L.slice(0, 60).map((x, i) => h`<tr key=${i}>
                    <td class="text-zinc-500">${tm(x.d, x.tk, lang)}</td>
                    <td class="font-bold text-white">${x.sym}</td>
                    <td>${x.k}</td>
                    <td>${usd(x.px)}</td>
                    <td class="font-bold ${x.pnl ? cl(x.pnl) : 'text-zinc-500'}">${x.pnl ? fmtBillion(x.pnl) : '—'}</td>
                  </tr>`)}
                </tbody>
              </table>`}
            </div>
          </div>
        </div>

        <div class="space-y-2.5">
          <div class="${PN} p-3 space-y-2.5">
            <div class="grid grid-cols-3 gap-1 bg-zinc-900 p-1 rounded border border-zinc-800 text-[10.5px]">
              <button onClick=${() => setTradeMode('actions')} class="py-1 rounded font-bold transition ${tradeMode === 'actions' ? 'bg-white text-black' : 'text-zinc-400 hover:text-white'}">${t.tabActions}</button>
              <button onClick=${() => { setTradeMode('options'); if (!optStrike) setOptStrike(String(Math.round(a.p))); }} class="py-1 rounded font-bold transition ${tradeMode === 'options' ? 'bg-white text-black' : 'text-zinc-400 hover:text-white'}">${t.tabOptions}</button>
              <button onClick=${() => setTradeMode('blitz')} class="py-1 rounded font-bold transition ${tradeMode === 'blitz' ? 'bg-white text-black' : 'text-zinc-400 hover:text-white'}">${t.tabBlitz}</button>
            </div>

            ${tradeMode === 'options' ? h`<div class="space-y-2.5">
              <div class="grid grid-cols-2 gap-1.5">
                <button onClick=${() => setOptType('CALL')} class="py-1.5 rounded text-xs font-black border ${optType === 'CALL' ? 'bg-emerald-600/20 border-emerald-500 text-emerald-300' : 'bg-zinc-900 border-zinc-800 text-zinc-500'}">${t.callBull}</button>
                <button onClick=${() => setOptType('PUT')} class="py-1.5 rounded text-xs font-black border ${optType === 'PUT' ? 'bg-rose-600/20 border-rose-500 text-rose-300' : 'bg-zinc-900 border-zinc-800 text-zinc-500'}">${t.putBear}</button>
              </div>

              <label class="block text-xs text-zinc-400">
                ${t.strikePrice} (${t.current}: ${usd(a.p)})
                <input type="number" step="1" value=${optStrike} onInput=${e => setOptStrike(e.target.value)} class="mt-1"/>
              </label>

              <div>
                <span class="block text-[10px] text-zinc-500 uppercase mb-1">${t.expiration}</span>
                <div class="grid grid-cols-3 gap-1">
                  ${[1, 3, 7].map(d => h`<button key=${d} onClick=${() => setOptDays(d)} class="py-1 rounded text-xs font-bold border ${optDays === d ? 'bg-white text-black border-white' : 'bg-zinc-900 border-zinc-800 text-zinc-400'}">${d} ${d === 1 ? (lang === 'en' ? 'Day' : 'Día') : (lang === 'en' ? 'Days' : 'Días')}</button>`)}
                </div>
              </div>

              <label class="block text-xs text-zinc-400">
                ${t.contractsLabel}
                <input type="number" min="1" step="1" value=${optContracts} onInput=${e => setOptContracts(e.target.value)} class="mt-1"/>
              </label>

              <div class="p-2 rounded bg-zinc-900 border border-zinc-800 text-[11px] space-y-1">
                <div class="flex justify-between"><span class="text-zinc-400">${t.premiumPerShare}</span><b class="text-white">${usd(optPremPerShare)}</b></div>
                <div class="flex justify-between"><span class="text-zinc-400">${t.totalPremiumCost}</span><b class="text-zinc-200">${usd(optTotalCost)}</b></div>
              </div>

              <button onClick=${goOption} class="w-full py-2.5 rounded bg-white hover:bg-zinc-200 text-black font-black text-xs transition shadow-lg">
                ${t.buyContract} ${optType} (${usd(optTotalCost)})
              </button>
            </div>` : tradeMode === 'blitz' ? h`<div class="space-y-2.5">
              <div>
                <span class="block text-[10px] text-zinc-500 uppercase mb-1">${t.expiryTime}</span>
                <div class="grid grid-cols-4 gap-1">
                  ${[15, 30, 60, 120].map(sec => h`<button key=${sec} onClick=${() => setBlitzSec(sec)} class="py-1 rounded text-xs font-bold border ${blitzSec === sec ? 'bg-white text-black border-white' : 'bg-zinc-900 border-zinc-800 text-zinc-400'}">${sec}s</button>`)}
                </div>
              </div>

              <label class="block text-xs text-zinc-400">
                ${t.blitzInvestment}
                <input type="number" min="10" step="50" value=${blitzStake} onInput=${e => setBlitzStake(e.target.value)} class="mt-1 text-sm font-bold"/>
              </label>

              <div class="flex gap-1">
                ${[250, 1000, 5000, 25000].map(amt => h`<button key=${amt} onClick=${() => setBlitzStake(String(amt))} class="flex-1 py-0.5 rounded bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-[10px] text-zinc-300">${fmtBillion(amt)}</button>`)}
              </div>

              <div class="p-2 rounded bg-zinc-900/90 border border-zinc-800 flex justify-between items-center text-xs">
                <span class="text-zinc-400">${t.expectedReturn} <b class="text-emerald-400">+92%</b></span>
                <b class="text-emerald-400">${usd((+blitzStake || 0) * 1.92)} <span class="text-[10px] text-zinc-500 font-normal">${t.totalReturn}</span></b>
              </div>

              <div class="grid grid-cols-2 gap-2">
                <button onClick=${() => goBlitz('up')} class="py-3 rounded bg-emerald-600 hover:bg-emerald-500 text-white font-black text-xs flex flex-col items-center gap-0.5 shadow-lg shadow-emerald-900/30 transition">
                  <span class="text-sm">↗ ${t.upBtn}</span>
                  <span class="text-[9px] font-normal opacity-90">&gt; ${usd(a.p)}</span>
                </button>
                <button onClick=${() => goBlitz('down')} class="py-3 rounded bg-rose-600 hover:bg-rose-500 text-white font-black text-xs flex flex-col items-center gap-0.5 shadow-lg shadow-rose-900/30 transition">
                  <span class="text-sm">↘ ${t.downBtn}</span>
                  <span class="text-[9px] font-normal opacity-90">&lt; ${usd(a.p)}</span>
                </button>
              </div>

              ${(g.B || []).length > 0 && h`<div class="pt-2 border-t border-zinc-800 space-y-1.5">
                <span class="text-[10px] font-bold uppercase text-zinc-400 block">${t.activeBlitz} (${g.B.length})</span>
                <div class="max-h-36 overflow-y-auto space-y-1">
                  ${g.B.map(b => {
                    const cur = g.a[b.sym].p;
                    const win = (b.dir === 'up' && cur > b.entryPx) || (b.dir === 'down' && cur < b.entryPx);
                    return h`<div key=${b.id} class="p-1.5 rounded bg-[#08080a] border ${win ? 'border-emerald-500/40' : 'border-rose-500/40'} text-[11px]">
                      <div class="flex justify-between font-bold">
                        <span>${b.sym} ${b.dir === 'up' ? '↗' : '↘'} $${b.stake}</span>
                        <span class=${win ? 'text-emerald-400' : 'text-rose-400'}>${win ? t.winning : t.losing} · ${b.remSec}s</span>
                      </div>
                      <div class="w-full h-1 bg-zinc-800 rounded mt-1 overflow-hidden">
                        <div class="h-full ${win ? 'bg-emerald-500' : 'bg-rose-500'} transition-all" style=${{ width: (b.remSec / b.totalSec * 100) + '%' }}></div>
                      </div>
                    </div>`;
                  })}
                </div>
              </div>`}
            </div>` : h`<div class="space-y-2.5">
              <div class="p-2 rounded bg-[#08080a] border border-zinc-800 flex justify-between items-center text-xs">
                <div>
                  <span class="text-[10px] text-zinc-500 block">${t.position}</span>
                  <b class=${P.q > 0 ? 'text-emerald-400' : P.q < 0 ? 'text-rose-400' : 'text-zinc-400'}>${P.q > 0 ? `LONG ${P.q} (${P.lev}x)` : P.q < 0 ? `SHORT ${Math.abs(P.q)} (${P.lev}x)` : t.neutral}</b>
                </div>
                <div class="text-right">
                  <span class="text-[10px] text-zinc-500 block">${t.unrealizedPnl}</span>
                  <b class=${cl(uPnl)}>${fmtBillion(uPnl)}</b>
                </div>
              </div>

              <div class="grid grid-cols-2 gap-1 bg-zinc-900 p-1 rounded border border-zinc-800 text-[11px]">
                <button onClick=${() => setOrderType('market')} class="py-1 rounded font-semibold ${orderType === 'market' ? 'bg-white text-black font-bold' : 'text-zinc-400'}">${t.marketOrder}</button>
                <button onClick=${() => { setOrderType('limit'); setLimitPx(a.p.toFixed(2)); }} class="py-1 rounded font-semibold ${orderType === 'limit' ? 'bg-white text-black font-bold' : 'text-zinc-400'}">${t.limitOrder}</button>
              </div>

              ${orderType === 'limit' && h`<label class="block text-xs text-zinc-400">
                ${t.targetPrice}
                <input type="number" step="0.01" value=${limitPx} onInput=${e => setLimitPx(e.target.value)} class="mt-1"/>
              </label>`}

              <div>
                <div class="flex justify-between text-[11px] mb-1">
                  <span class="text-zinc-400">${t.leverage} (${t.maxWord} ${maxLevAllowed}x)</span>
                  <b class="text-white">${lev}x</b>
                </div>
                <div class="grid grid-cols-5 gap-1">
                  ${[1, 2, 5, 10, 20].filter(v => v <= maxLevAllowed).map(v => h`<button key=${v} onClick=${() => setLev(v)} class="py-1 rounded text-[11px] font-bold border ${lev === v ? 'bg-white text-black border-white' : 'bg-zinc-900 border-zinc-800 text-zinc-400'}">${v}x</button>`)}
                </div>
              </div>

              <div class="grid grid-cols-2 gap-1 bg-zinc-900 p-1 rounded border border-zinc-800 text-[11px]">
                <button onClick=${() => setByUsd(false)} class="py-1 rounded ${!byUsd ? 'bg-zinc-800 text-white font-semibold' : 'text-zinc-400'}">${t.units}</button>
                <button onClick=${() => setByUsd(true)} class="py-1 rounded ${byUsd ? 'bg-zinc-800 text-white font-semibold' : 'text-zinc-400'}">${t.usdAmount}</button>
              </div>

              <label class="block text-xs text-zinc-400">
                ${byUsd ? t.marginToInvest : t.shareQty}
                <input type="number" step="any" value=${q} onInput=${e => setQ(e.target.value)} class="mt-1"/>
              </label>

              <div class="flex gap-1">
                ${[0.25, 0.5, 1].map(p => h`<button key=${p} onClick=${() => setQ(String(byUsd ? Math.floor(g.cash * p * 100) / 100 : uf(a, 'buy', g.cash * p, lev, g)))} class="flex-1 py-1 rounded bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-[10px]">${p * 100}%</button>`)}
                ${P.q !== 0 && h`<button onClick=${() => { setByUsd(false); setQ(String(Math.abs(P.q))); }} class="flex-1 py-1 rounded bg-zinc-200/15 border border-zinc-500 text-white text-[10px] font-bold">${t.closeBtn}</button>`}
              </div>

              <div class="grid grid-cols-2 gap-1.5 pt-1 border-t border-zinc-800/80">
                <input type="number" step="0.01" placeholder="Stop Loss" value=${sl} onInput=${e => setSl(e.target.value)} class="text-xs"/>
                <input type="number" step="0.01" placeholder="Take Profit" value=${tp} onInput=${e => setTp(e.target.value)} class="text-xs"/>
              </div>
              ${rrRatio && h`<div class="text-[10px] text-center text-zinc-400">${t.rrRatio} <b class="text-white">1 : ${rrRatio}</b></div>`}
              ${P.q !== 0 && h`<button onClick=${setLv} class="w-full py-1 rounded bg-zinc-800 hover:bg-zinc-700 text-zinc-200 text-xs">${t.applySlTp}</button>`}

              <div class="grid grid-cols-2 gap-2 pt-1">
                <button onClick=${() => go('buy')} class="py-2 rounded bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs transition shadow-lg shadow-emerald-900/20">${P.q < 0 ? t.closeShort : t.buyLong}</button>
                <button onClick=${() => go('sell')} class="py-2 rounded bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs transition shadow-lg shadow-rose-900/20">${P.q > 0 ? t.sellLong : t.shortSell}</button>
              </div>
            </div>`}
          </div>

          <div class="${PN} p-3">
            <div class="flex justify-between items-center mb-2">
              <b class="text-[11px] uppercase tracking-wider text-zinc-300">${t.orderBook} (${a.sym})</b>
              <span class="text-[10px] text-zinc-500">Depth L2</span>
            </div>
            <${Book} a=${a} t=${t} onPickPrice=${px => { setOrderType('limit'); setLimitPx(px); }}/>
          </div>
        </div>
      </div>
    </div>

    <${CapitalModal} open=${capModalOpen} onClose=${() => setCapModalOpen(false)} currentCap=${g.cash} onApply=${applyCapitalChange} lang=${lang} t=${t}/>
    <${ProfileModal} open=${profileModalOpen} onClose=${() => setProfileModalOpen(false)} profile=${profile} onSave=${saveProfile} t=${t}/>
    <${NewsPortalModal} open=${nm} onClose=${() => setNm(false)} nl=${nl} g=${g} nf=${nf} setNf=${setNf} newsQuery=${newsQuery} setNewsQuery=${setNewsQuery} onTriggerNews=${triggerManualNews} onSelectAsset=${selectAsset} onOpenArticle=${setActiveArticle} lang=${lang} t=${t}/>
    <${ArticleReaderModal} item=${activeArticle} g=${g} onClose=${() => setActiveArticle(null)} onSelectAsset=${selectAsset} onSelectArticle=${setActiveArticle} lang=${lang} t=${t}/>
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(h`<${App}/>`);
</script>
</body>
</html>
